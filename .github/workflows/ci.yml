name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LENS_EXTENSION_DEPENDENCY_VERSIONS_FILE: ${{ github.workspace }}/.github/lens-extension-dependency-versions.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Install browser
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Tests, browser checks and build
        run: npm run check
      - name: Verify package contents
        run: npm run check:package
      - name: Create installable archive
        run: npm pack
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: package
          path: release-artifacts
      - name: Release new package versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump package.json to create another release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null); then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::$tag already points to another commit. Bump the package version."
              exit 1
            fi
          fi
          args=(--target "$GITHUB_SHA" --title "$tag" --generate-notes)
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$tag" release-artifacts/*.tgz "${args[@]}"
          echo "Created GitHub release $tag with the tested npm archive. This does not publish to npm." >> "$GITHUB_STEP_SUMMARY"
